name: 虎牙每日助手

on:
  workflow_dispatch:
    inputs:
      version:
        description: 运行版本
        type: choice
        options: [v2, v1]
        default: v2
      room_url:
        description: 目标主播直播间地址（如 https://www.huya.com/123456）
        type: string
        default: ""
      gift_count:
        description: 送虎粮个数（0 为全部）
        type: string
        default: "0"
      daka:
        description: 执行每日打卡
        type: choice
        options: ["true", "false"]
        default: "true"
      welfare:
        description: 领取每日 10 虎粮（仅 v2）
        type: choice
        options: ["true", "false"]
        default: "true"
      wechat_push:
        description: 推送企业微信报告（auto 跟随中枢托管策略，true 强制单仓直推，false 禁用）
        type: choice
        options: ["auto", "true", "false"]
        default: "auto"

permissions:
  contents: read

jobs:
  daily:
    name: 虎牙打卡与送粮任务
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装项目依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 按需安装 V1 网页端浏览器
        if: ${{ inputs.version == 'v1' || (inputs.version == '' && vars.HUYA_VERSION == 'v1') }}
        run: |
          playwright install --with-deps chromium

      - name: 检查 Python 语法完整性
        run: |
          python -m compileall -q .

      - name: 执行每日打卡送粮与中枢上报
        env:
          HUYA_VERSION: ${{ inputs.version || vars.HUYA_VERSION || 'v2' }}
          HUYA_ROOM_URL: ${{ inputs.room_url || vars.HUYA_ROOM_URL || secrets.HUYA_ROOM_URL || '' }}
          HUYA_GIFT_COUNT: ${{ inputs.gift_count || vars.HUYA_GIFT_COUNT || '0' }}
          HUYA_DAKA: ${{ inputs.daka || vars.HUYA_DAKA || 'true' }}
          HUYA_WELFARE: ${{ inputs.welfare || vars.HUYA_WELFARE || 'true' }}
          HUYA_WECHAT_PUSH: ${{ inputs.wechat_push || vars.HUYA_WECHAT_PUSH || 'auto' }}
          HUYA_FORCE_WECHAT_PUSH: ${{ inputs.wechat_push == 'true' && 'true' || 'false' }}
          HUYA_LOCAL_DEBUG: "false"
          HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
          HUYA_ACCOUNT: ${{ secrets.HUYA_ACCOUNT }}
          HUYA_PASSWORD: ${{ secrets.HUYA_PASSWORD }}
          WX_WEBHOOK: ${{ secrets.WX_WEBHOOK }}
          CHECKIN_HUB_URL: "https://checkin.wwcoder.top"
          CHECKIN_HUB_TOKEN: ${{ secrets.CHECKIN_HUB_TOKEN }}
          HUB_MANAGED_NOTIFY: "true"
        run: python main.py

      - name: 上传异常截图归档
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: screenshots/
          if-no-files-found: ignore
